name: stucktoship

services:
  stucktoship-api:
    build: .
    environment:
      APP_MODE: agent_course
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      KNOWLEDGE_DIR: /app/knowledge
      STUCKTOSHIP_MILVUS_URI: http://milvus-standalone:19530
      DATABASE_URL: sqlite+aiosqlite:////data/stucktoship_business.db
      ENABLE_TRACE: "true"
      ENABLE_EVALUATION_API: "true"
      STUCKTOSHIP_API_KEYS: ${STUCKTOSHIP_API_KEYS:?set STUCKTOSHIP_API_KEYS}
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge:ro
      - stucktoship-data:/data
    depends_on:
      - milvus-standalone
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - milvus-minio:/minio_data

  milvus-standalone:
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus

volumes:
  stucktoship-data:
  milvus-etcd:
  milvus-minio:
  milvus-data:
